# Ordering and headings for the field-note listings on the section hubs and
# the /blog/ index.
# Notes carry `section` and `group` in their front matter; this file decides
# which groups appear, in what order, under what heading.
robotics:
  - id: intro
    title: "Getting started"
  - id: ros
    title: "ROS (Robot Operating System)"
  - id: navigation
    title: "Navigation"
vision:
  - id: cv
    title: "Computer vision basics"
  - id: math
    title: "Math for geometry"
# Pure-opinion posts that fit neither subject. New posts are scaffolded with
# `scripts/new-note.sh blog perspective <slug>`; they render under the
# "Perspectives" heading on /blog/ and nowhere else.
blog:
  - id: perspective
    title: "Perspectives"
