# One source of truth for the Multimodal Models guide's part list.
# Part numbers live here only — page descriptions/titles must not restate them.
# The `acts:` list groups the pill nav under act labels (see
# _includes/series-nav.html); parts carry an `act:` key matching one of these
# ids, added by hand because scripts/new-part.sh does not emit it.
# `appendix:` holds the glossary so the linter's part-count check sees the real
# part count, not part count + 1 (an appendix is a reference card, not a part).
hub: /ai/multimodal/
title: Multimodal Models, Interactively
acts:
  - id: seeing
    label: "I · Seeing"
  - id: gluing
    label: "II · Gluing vision to a language model"
  - id: trunk
    label: "III · One trunk, many modalities"
  - id: beyond
    label: "IV · Beyond text out"
parts:
  - num: 1
    act: seeing
    title: "Pixels into tokens"
    short: "Part 1"
    permalink: /ai/multimodal/vit/
    blurb: "Patching an image into a sequence, position embeddings and the class token, and what a vision transformer gives up against a convolution."
  - num: 2
    act: seeing
    title: "Caption matches picture"
    short: "Part 2"
    permalink: /ai/multimodal/contrastive/
    blurb: "InfoNCE on the similarity matrix, the temperature and batch size it needs, and SigLIP's pairwise sigmoid alternative."
  - num: 3
    act: seeing
    title: "What a shared space buys"
    short: "Part 3"
    permalink: /ai/multimodal/shared-embedding-space/
    blurb: "Zero-shot classification, retrieval and prompt templates, and the compositionality, counting and typographic failures the space inherits."
  - num: 4
    act: seeing
    title: "The modality zoo"
    short: "Part 4"
    permalink: /ai/multimodal/modalities/
    blurb: "Audio, video and 3D encoders aligned into one space, what a hub modality binds, and what aligned does and does not mean."
