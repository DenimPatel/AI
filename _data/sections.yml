# The top-level subjects. Drives the global nav (_includes/site-nav.html),
# the homepage doors, and each section hub page (_layouts/section-hub.html).
#
# The interactive guides moved to their own repo in Aug 2026:
#   https://denimpatel.github.io/interactive-courses/
# This repo keeps the record (timeline/products/benchmarks/labs/voices/papers),
# the field notes, and the blog. There are no `series:` keys here any more —
# `_layouts/section-hub.html` no longer renders series grids, and the homepage
# counters read the generated `_data/guide_index.yml` instead.
#
# Contract - one entry per section, keys:
#   id        (required) matches page front-matter `section:` values for this subject.
#   title     (required) the section's display name.
#   url       (required) the section hub's own permalink.
#   kicker    (required) short label shown above the h1 on the hub.
#   blurb     (required) the hub's lede paragraph.
#   pages     (optional) a list of {title, url, blurb} hand-authored pages to card-grid
#             at the top of the hub (e.g. the /ai/ record pages). Omit if the section has
#             none.
#   notes_path / notes_blurb (optional, must be given together) - when set, the hub
#             renders a "Background notes" heading with this blurb, followed by
#             {% include note-list.html section=<id> %} (the field-note listing for
#             this section, grouped/ordered by _data/note_groups.yml). Omit both if the
#             section has no field notes.
- id: ai
  title: "AI"
  url: /ai/
  kicker: "The record"
  blurb: "A running record of the field - milestones, product releases, benchmark scores, the labs building it, and what people said at the time. The interactive guides to how language models are trained, served, built with and made to see now live on the companion guides site."
  pages:
    - title: "History timeline"
      url: /ai/timeline/
      blurb: "Key events in the development of AI as a field, from the Turing Test to AlphaFold."
    - title: "Product timeline"
      url: /ai/products/
      blurb: "The full chronology of significant AI product releases, and the race between closed and open-weight models."
    - title: "Benchmarks"
      url: /ai/benchmarks/
      blurb: "How the frontier has moved on MMLU, GPQA Diamond, SWE-bench Verified and ARC-AGI."
    - title: "Labs & companies"
      url: /ai/labs/
      blurb: "Who is building it - focus areas and defining releases for ten frontier and open-weight labs."
    - title: "Voices on AI"
      url: /ai/voices/
      blurb: "Quotes from scientists, researchers and industry leaders, grouped by perspective."
    - title: "Key papers"
      url: /ai/papers/
      blurb: "An annotated bibliography of the landmark papers, 1943 to today, each with a link to the original."

- id: vision
  title: "Vision & Geometry"
  url: /vision/
  kicker: "Field notes"
  blurb: "Background notes on OpenCV basics, linear algebra and quaternions - the on-ramp to the multi-view geometry and nonlinear optimization guides, which now live on the companion guides site."
  notes_path: /vision/notes/
  notes_blurb: "Background notes on OpenCV basics, linear algebra and quaternions - the on-ramp to both guides."

- id: robotics
  title: "Robotics"
  url: /robotics/
  kicker: "Field notes"
  blurb: "Notes and tutorials on ROS and robot navigation, migrated from the Robotics At Once blog."
  notes_path: /robotics/
  notes_blurb: "Notes and tutorials on ROS and robot navigation, migrated from the Robotics At Once blog."

- id: blog
  title: "Blog"
  url: /blog/
  kicker: "Views & perspectives"
  blurb: "Personal perspective pieces, gathered with the field notes from both subjects - the informal, from-the-workbench writing that does not fit a timeline or an interactive guide."
