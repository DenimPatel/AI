<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% else %}<meta name="description" content="{{ site.description }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="{{ '/' | relative_url }}">AI /</a>
  {% if page.layout == 'home' %}
    <a href="#history">History</a>
    <a href="#products">Products</a>
    <a href="#voices">Voices</a>
    <a href="#robotics">Robotics</a>
  {% elsif page.layout == 'robotics-article' %}
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/robotics/' | relative_url }}">Robotics</a>
  {% else %}
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/#history' | relative_url }}">History</a>
    <a href="{{ '/#products' | relative_url }}">Products</a>
    <a href="{{ '/#voices' | relative_url }}">Voices</a>
    <a href="{{ '/robotics/' | relative_url }}">Robotics</a>
  {% endif %}
</nav>

<main>
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="stats-rule"></div>
    <p style="margin:0;">Have a milestone to add? <a href="https://github.com/DenimPatel/AI">Contribute on GitHub</a>.</p>
  </div>
</footer>

</body>
</html>
